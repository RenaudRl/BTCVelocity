# BTC CloudNet Wake: every text a player sees. MiniMessage format.
# Placeholders: <task> (the task asked for) everywhere, <seconds> (the wait limit) in wake.timeout.
# Edit this copy (on CloudNet: in the proxy template). A key removed here falls back to its default.

# Shown in the limbo while the service starts (replaces the "no lobby available" text).
wake.waiting=<gray>Le serveur <white><task></white> était arrêté : démarrage en cours. Tu seras transféré automatiquement dès qu'il sera prêt.
# Shown when the service is ready and the player is being sent to it.
wake.ready=<green>Le serveur <white><task></white> est prêt, transfert en cours.
# Shown when the wait limit passed without a service: the player goes back to a lobby.
wake.timeout=<red>Le serveur <white><task></white> n'a pas démarré en <seconds> s.</red> <gray>Tu retournes au lobby.
# Shown when the orchestrator could not start the service, or the transfer failed.
wake.failed=<red>Impossible de démarrer le serveur <white><task></white>.</red> <gray>Tu retournes au lobby.
