# BTC Arrival Router: every text a player or an operator sees. MiniMessage format.
# Edit this copy (on CloudNet: in the proxy template). A key removed here falls back to its default.

# Shown on arrival in the limbo when no lobby is available.
limbo.waiting=<gray>Aucun lobby n'est disponible pour le moment. Tu seras transféré automatiquement dès qu'il y en aura un.
# Shown on arrival in the limbo while maintenance is on.
limbo.maintenance=<gold>Le serveur est en maintenance.</gold> <gray>Tu seras transféré automatiquement à la fin de la maintenance.

# /btcmaintenance replies.
command.maintenance.enabled=<gold>Maintenance activée :</gold> <gray>les nouveaux arrivants sont retenus dans le limbo.
command.maintenance.disabled=<green>Maintenance désactivée :</green> <gray>les joueurs du limbo vont être transférés.
command.maintenance.status-on=<gray>Maintenance : <gold>activée</gold>. Usage : /btcmaintenance on|off
command.maintenance.status-off=<gray>Maintenance : <green>désactivée</green>. Usage : /btcmaintenance on|off
command.maintenance.no-limbo=<red>Aucun limbo n'est déclaré (BTC_ARRIVAL_LIMBO) : la maintenance ne peut retenir personne.
