# BTC Admission Shield - local anti-VPN.
#
# A connection whose address is in a datacenter list or a Tor exit list is refused. An address of
# a known VPN service (X4BNet "vpn" list) is NEVER refused: it is let in, written to the journal
# (basis=vpn-signal) and told to the staff (see lists.vpn-signal). Everything is
# decided in memory from files kept on this proxy. NO player address is ever sent anywhere: the
# only outbound traffic is the periodic download of the public lists below, which carries no
# player data. There is no remote API.
#
# Every decision that matters (each refusal, each "observed") is written as one key=value line to
# the logger "btc.admission.journal". The file log4j2-admission-journal.xml, written next to this
# one on first start, gives that logger its own file, rotated daily and purged after 180 days;
# it takes effect through -Dlog4j2.configurationFile (see the module README).
# Each refusal is also told to the staff online, at most one message every 10 seconds.
#
# Staff command: /admission why <pseudo|ip>   and   /admission status
#   account links (section links, off by default): /admission alts <uuid|online name>,
#   /admission household add <a> <b> [reason] | remove <a>,  /admission forget <uuid>
# Permission: btc.admission.staff (the console always has it).

# enforce : refuse listed addresses.  observe : only journal them (dry run), let everybody in.
mode: enforce

# Addresses Geyser connects from. A Floodgate player connecting from one of these is NOT judged
# on that address (every Bedrock player shares it): Floodgate's record of the player's real
# address is judged instead when it can be read; otherwise the player is admitted and the journal
# says "bedrock, ip reelle inconnue". A connection from one of these that is NOT a Floodgate
# player is journaled as "geyser-address-not-floodgate", logged as a warning, and judged on the
# address like any other. Needs Floodgate. IP literals or CIDR, IPv4 or IPv6.
# EMPTY until the bench has measured the address the proxy sees for a Bedrock player (13.1).
geyser-addresses: []

# Let in even from a listed address.
exemptions:
  # An exemption is a hole in the shield: say why it exists and, when you can, when it ends.
  # Every entry accepts two optional-for-players fields:
  #   reason:  free text for the staff, shown in /admission status and in the load warnings.
  #   expires: AAAA-MM-JJ, the LAST valid day (UTC). The day after, the entry no longer applies,
  #            with no restart needed. An entry already over when the file is read is ignored with
  #            a WARN; an unreadable date refuses the entry (an ERROR, it exempts nobody).
  # Each player needs BOTH the name and the UUID, and both must match the authenticated account.
  # An entry with only one of them is a configuration error: reported, and it exempts nobody.
  # Without `expires` a player exemption never ends (the form used before the dates existed).
  players: []
  #  - name: SomeStaffMember
  #    uuid: 00000000-0000-0000-0000-000000000000
  #    reason: moderateur en deplacement
  #    expires: 2026-12-31
  #  - name: SomePartner
  #    uuid: 11111111-1111-1111-1111-111111111111
  # Networks (CIDR or single address), e.g. an office or a partner's fixed connection. A fixed
  # address changes hands, so `expires` is REQUIRED for every NEW entry here. An entry that already
  # exists without it (the bare form `- 203.0.113.0/24` included) is never refused: it keeps
  # exempting, with a WARN "exemption réseau non datée, à dater" at every load, and
  # /admission status lists it as "non datée". Date it to silence the warning.
  networks: []
  #  - network: 203.0.113.0/24
  #    reason: bureau du partenaire
  #    expires: 2026-12-31

# Shown to a refused player, MiniMessage format. {code} is replaced by the cause code
# (ADM-VPN-DC for datacenter, ADM-VPN-TOR for Tor, ADM-VPN-ASN for a denied autonomous system,
# ADM-RATE-NET for too many attempts from one network), which is also in the journal line.
messages:
  datacenter: "<red>Connexion refusée.</red>\n<gray>Votre adresse appartient à un réseau d'hébergement ou de VPN. Si vous n'utilisez pas de VPN, contactez le staff avec le code <white>{code}</white>.</gray>"
  tor: "<red>Connexion refusée.</red>\n<gray>Les connexions depuis le réseau Tor ne sont pas acceptées. Contactez le staff avec le code <white>{code}</white>.</gray>"
  asn: "<red>Connexion refusée.</red>\n<gray>Votre adresse appartient à un fournisseur d'hébergement ou de VPN. Si vous n'utilisez pas de VPN, contactez le staff avec le code <white>{code}</white>.</gray>"
  network-rate: "<red>Connexion refusée.</red>\n<gray>Trop de tentatives de connexion depuis votre réseau. Patientez quelques secondes puis réessayez. Si cela persiste, contactez le staff avec le code <white>{code}</white>.</gray>"
  # ADM-ALT-BAN (see links below). The player's language is unknown at the login: French and
  # English together. Never names the linked account.
  linked-ban: "<red>Connexion refusée / Connection refused.</red>\n<gray>Contactez le staff avec le code / Contact the staff with the code <white>{code}</white>.</gray>"
  # ADM-ALT-MAX (links.max-online-per-address). Same two languages, same rule: no account named.
  online-cap: "<red>Trop de comptes connectés depuis cette adresse / Too many accounts online from this address.</red>\n<gray>Si vous jouez en famille, contactez le staff avec le code / If you play with family, contact the staff with the code <white>{code}</white>.</gray>"

# BOUND ON CONNECTION ATTEMPTS PER NETWORK (Sentinel 13.4). Independent of the lists above.
# Every pre-login spends one token of its network: an IPv4 /24 or an IPv6 /48 (6to4, Teredo, NAT64
# and IPv4-mapped addresses are first read as the IPv4 address they carry). A network owns a
# bucket of `burst` tokens that refills at `attempts` per `window-seconds`; an attempt that finds
# it empty is over the limit. A refused attempt spends nothing, so the players of a throttled
# network still get through at the sustained rate while a bot wave is turned away.
#
# Why these values: a /24 of a French mobile carrier behind carrier-grade NAT stands for a few
# hundred subscribers. 10 attempts / 10 s is one per second sustained, far above what such a /24
# produces in normal play; a burst of 20 lets a group join together or a wave of reconnections
# after a restart through. A bot wave from one network passes its first 20 attempts and then
# crawls at one per second. Measure in `observe` before enforcing (task 13.5).
#
# NEVER applied to: addresses that are not public (loopback, private, 100.64.0.0/10, link-local,
# unique-local), `geyser-addresses` (every Bedrock player arrives from it), and
# `exemptions.networks`. A player exemption (name AND UUID) cannot be checked at the pre-login,
# where anyone can type any name: an attempt over the limit whose name some exemption carries is
# not refused there, the decision waits for the login; an authenticated player named by an
# exemption is then let in, anyone else with that name is refused if the network is still over
# its limit. In `observe`, nothing is deferred: the attempt is only journaled.
network-rate:
  enabled: true
  # observe : journal the attempts over the limit (decision=observed, code stays none) and let
  #           them in.  enforce : refuse them (ADM-RATE-NET). The module-wide `mode: observe`
  #           also holds this bound back. Default observe: the limit is not measured yet.
  mode: observe
  attempts: 10
  window-seconds: 10
  # At least `attempts`; left out, twice `attempts`.
  burst: 20
  # Network size: IPv4 16..32, IPv6 32..64. A shorter prefix groups more players together.
  ipv4-prefix: 24
  ipv6-prefix: 48
  # Networks followed at once (1000..1000000). Beyond it the least recently seen is forgotten, and
  # a forgotten network starts again with a full bucket: pressure on the table lets attempts
  # through, it never refuses an innocent network.
  max-networks: 20000
  # GROUP A HOSTING PROVIDER BY ITS AUTONOMOUS SYSTEM. A bot wave rented from one provider arrives
  # from many of its networks at once; counted per /24 each stays under the limit. With true, the
  # addresses of a system listed in asn.deny-asns, or whose name holds an asn.observe-keywords word,
  # share ONE bucket "AS<number>" (same attempts / burst as above). Every other address, a system
  # that is not hosting included, keeps its /24 or /48: a residential or mobile operator is one
  # system too, and one bucket for its subscribers would starve them. Needs asn.enabled.
  # Off by default: first see in the journal (asn=, as_name=) which systems the waves come from.
  group-hosting-by-asn: false
  # In ENFORCE, a system that announces more than this share of the address space (percent, of IPv4
  # or of IPv6 2000::/3; ]0, 100]) is NOT grouped and keeps its /24 or /48, with a WARN: a file that
  # stretched a "hosting" system over the internet would put millions of players in one bucket. In
  # observe the grouping is only counted, so it is not held back.
  max-asn-share-percent: 1

# AUTONOMOUS SYSTEMS (Sentinel 13.2). Which operator announces an address, from the IP-to-ASN table
# of iptoasn.com (public domain, PDDL v1.0; MaxMind GeoLite2 was refused for its licence). It is
# downloaded in the same task as the lists below, with the same safeguards: a bounded size, the last
# good version kept on any failure, the embedded baseline for a first load, a bounded variation
# between two versions, and the quarantine of lists.quarantine-hours when deny-asns is not empty.
# The table (about 14 MiB in memory, read in 1.5 s) is searched by bisection; nothing leaves the
# proxy. Whatever the settings below, a journaled decision carries `asn=` and `as_name=` when the
# table knows the address, and /admission why <ip> names the system.
asn:
  # false : no download, no lookup; the journal has no asn= field and the rest of this section does
  # nothing.
  enabled: true
  # observe : journal what deny-asns would refuse (decision=observed) and let everybody in.
  # enforce : refuse the systems of deny-asns (ADM-VPN-ASN). The module-wide `mode: observe` also
  # holds this back. Default observe: nothing is denied until a person has chosen what to deny.
  mode: observe
  # AS numbers refused like a datacenter list, e.g. [16276, "AS14061"]. EMPTY by default: an
  # operator is added after /admission why shows it is hosting. Exemptions apply as for a list.
  deny-asns: []
  # Words (any case) looked for in the NAME of the system. A hit is journaled (basis=asn-keyword)
  # and told to the staff online; the connection is never refused for it. E.g. ["hosting", "vpn"].
  # EMPTY by default: a word such as "cloud" also names legitimate operators. At least 3
  # characters: a shorter word is ignored with a WARN (it would match a large share of the names).
  # With network-rate.group-hosting-by-asn the systems a word names are held to the coverage limits
  # and to the quarantine, like the denied ones.
  observe-keywords: []
  # The public download. https only.
  url: https://iptoasn.com/data/ip2asn-combined.tsv.gz
  # The file weighs 9 MB (October 2026); a longer download is cut and thrown away.
  max-download-megabytes: 32
  # The file has 723 000 rows (October 2026). More than this, or (without a previous version) a
  # count far from that, and the file is thrown away.
  max-rows: 2000000

lists:
  # How often the lists are downloaded again. A failed download keeps the last valid list.
  refresh-hours: 24
  # For the whole download: connection, headers and body.
  download-timeout-seconds: 30
  # The largest default list is under 1 MB; a longer download is cut and thrown away.
  max-download-megabytes: 8
  # A list is thrown away (the last valid one stays, an ERROR is logged) if it holds more entries
  # than this (reading stops as soon as it is crossed), covers more than 20 % of the IPv4 space or more than 0.01 % of the IPv6 space
  # 2000::/3, or, compared with the version in use, moves its entry count by more than 50 %,
  # doubles its coverage, or brings a family (IPv4, IPv6) the version in use does not have.
  # A line wider than /8 (IPv4) or /20 (IPv6) is ignored. Private, loopback, CGNAT, link-local and
  # unique-local addresses are never classified, whatever a list says.
  max-entries: 500000
  # A default list with NO previous version (first start, or this directory is not kept between
  # two starts, as with a recreated CloudNet template) is judged against bounds shipped with the
  # module: entries and coverage per family, taken from the real lists with a wide margin. Set
  # to false only if a default list has outgrown them (the ERROR in the log says which bound);
  # the first load is then judged by the absolute guards alone.
  embedded-baseline: true
  # QUARANTINE. A new version of a list that is already in use (it passed the guards above, and is
  # not byte-identical to the one in use) is NOT put in use at once: it waits this many hours in
  # <file>.candidate. Meanwhile the version in use keeps deciding, and the new one only watches:
  # every authenticated player it would refuse IN ADDITION is journaled once as decision=would_refuse
  # and counted. At the end, if that count is <= quarantine-max-extra-players the new version is
  # put in use; otherwise it is thrown away, an ERROR is logged and the staff online is told (the
  # next download starts again). This stops a poisoning that grows by steps, each within the guards.
  # 0 hours = no quarantine. A restart forgets a quarantine (the next download starts a new one).
  # The default 0 means one single player the new version would refuse is enough to reject it;
  # raise it if legitimate new listings keep being held back (a new datacenter range will refuse
  # the odd VPN user it is meant to refuse).
  quarantine-hours: 6
  quarantine-max-extra-players: 0
  # SIGNAL ON KNOWN VPN SERVICES. true : the sources of class vpn below are loaded; an address they
  # hold (and no refusing list holds) is admitted in EVERY mode, journaled as decision=admitted
  # basis=vpn-signal and told to the staff online, with its own window. An address a datacenter or
  # Tor list also holds is refused as such. false : the vpn sources are ignored (nothing is
  # downloaded for them). The journal keeps those admitted players for 180 days like the rest: say
  # so in the register of processing.
  vpn-signal: true
  # Files are kept in <this directory>/lists/. A source needs: class (datacenter | tor | vpn), an
  # https url, and a plain file name. Leave this section out to use the five lists below. A
  # `sources:` written out without the vpn entries has no signal: copy them in to get it.
  #  - X4BNet lists_vpn (MIT): networks of hosting providers (datacenter) and of VPN services
  #    (vpn), built from ASNs and from the providers' published ranges.
  #  - FireHOL tor_exits: built from the Tor Project's own exit list, updated every 5 minutes.
  #    IPv4 only: IPv6 Tor exits are not covered.
  sources:
    x4bnet-datacenter-ipv4:
      class: datacenter
      url: https://raw.githubusercontent.com/X4BNet/lists_vpn/main/output/datacenter/ipv4.txt
      file: x4bnet-datacenter-ipv4.txt
    x4bnet-datacenter-ipv6:
      class: datacenter
      url: https://raw.githubusercontent.com/X4BNet/lists_vpn/main/output/datacenter/ipv6.txt
      file: x4bnet-datacenter-ipv6.txt
    firehol-tor-exits:
      class: tor
      url: https://raw.githubusercontent.com/firehol/blocklist-ipsets/master/tor_exits.ipset
      file: firehol-tor-exits.ipset
    x4bnet-vpn-ipv4:
      class: vpn
      url: https://raw.githubusercontent.com/X4BNet/lists_vpn/main/output/vpn/ipv4.txt
      file: x4bnet-vpn-ipv4.txt
    x4bnet-vpn-ipv6:
      class: vpn
      url: https://raw.githubusercontent.com/X4BNet/lists_vpn/main/output/vpn/ipv6.txt
      file: x4bnet-vpn-ipv6.txt

# ACCOUNT LINKS (Sentinel 16.2). Brings together the accounts that log in from the same address, to
# spot a network ban dodged with a new account, WITHOUT getting in the way of a family that plays
# together from one home: declare them a household (/admission household add <a> <b>).
#
# Three levels, never transitive (A linked to B and B linked to C never links A to C):
#   STRONG    : the same address (an IPv4, or an IPv6 /64) within strong-window-days, counted from
#               the later of the last sighting and the ban, on an address that is NOT shared (at
#               most shared-address-accounts distinct accounts on it over 30 days) and is neither
#               listed (vpn, datacenter, tor, denied system) nor named by an asn.observe-keywords word.
#   WEAK      : the same IPv4 /24 or IPv6 /48 within weak-window-days, the same address seen longer
#               ago (up to 30 days), or a shared, listed or hosting address.
#   HOUSEHOLD : declared by the staff. Never refused, never signalled for it.
# ONLY a STRONG link to an account under a NETWORK ban in force (Sentinel, not revoked, not
# expired), from an account first seen AFTER that ban, refuses, and only in `enforce` (code
# ADM-ALT-BAN). An account already known before the ban is only signalled. Everything else is a
# journal line and a staff message. Nobody is ever banned by this module.
#
# What is stored (Sentinel database, tables <prefix>admission_sightings and
# <prefix>admission_households): for each session a SERVER ACCEPTED, the account UUID and two
# HMAC-SHA256 digests (the address or /64, the /24 or /48), with first and last seen times. Never the
# address itself. Kept retention-days after the last sighting, then purged daily.
# /admission forget <uuid> erases an account. Sentinel's sanctions are only READ.
# BEFORE `enabled: true`: register of processing (entry n. 3), terms of use, AIPD threshold check.
links:
  # false : nothing is read, nothing is recorded.
  enabled: false
  # off | observe | enforce.  observe : a strong link to a banned account is journaled
  # (decision=observed) and told to the staff, the player gets in.  enforce : refused, ADM-ALT-BAN.
  # The module-wide `mode: observe` also holds this back.
  mode: observe
  # Environment variable of the proxy host holding the HMAC key: base64 of at least 32 random bytes
  # (e.g. `openssl rand -base64 32`). Absent or too short: the links are DISABLED with an ERROR,
  # the proxy starts anyway. NEVER put the key in a file. Changing or losing it loses the link
  # history, and nothing else.
  key-env: BTC_ADMISSION_LINK_KEY
  database:
    # The Sentinel database (PostgreSQL). A URL holding a password is refused.
    jdbc-url: ""
    # A role owning its two tables, with SELECT only on <prefix>sanctions.
    username: btc_admission
    # Environment variable holding that role's password.
    password-env: BTC_ADMISSION_DB_PASSWORD
    # Sentinel's table prefix, ^[a-z][a-z0-9_]{0,31}$.
    table-prefix: btc_
    # Sentinel's identity.network-id: only the bans of this network count.
    network-id: borntocraft
    # A login waits at most this long for the database, then is ADMITTED anyway (fail open).
    lookup-timeout-ms: 1500
    max-pool-size: 2
    # PostgreSQL cancels a statement running longer than this (a lock, a slow plan): no thread of
    # this module stays stuck on it.
    statement-timeout-ms: 2000
    # The driver closes a connection silent for this long (a dead network that never answers).
    socket-timeout-seconds: 5
  strong-window-days: 7
  weak-window-days: 7
  # Above this many distinct accounts in 30 days, an address is shared (school, carrier NAT): it
  # never makes a STRONG link.
  shared-address-accounts: 4
  # Above this many distinct accounts in 30 days (the player's household counted once), the login
  # is signalled to the staff. Never refused.
  max-accounts-per-household: 5
  retention-days: 180
  # CAP OF ACCOUNTS ONLINE AT ONCE ON ONE ADDRESS. 0 (the default) = no cap: nothing is counted and
  # a family of any size plays. N >= 1: a login is turned away (code ADM-ALT-MAX) when N OTHER
  # accounts are already online on its address (an IPv4, or an IPv6 /64), a declared household
  # (/admission household add) not counted, so two siblings play together under any cap >= 1 and
  # three accounts do not trip a cap of 3. Counted in memory by address digest from the moment a
  # server accepts the session until the player leaves: a burst of logins at the very same instant
  # can slip past it by the size of the burst. Blocks the extra SESSION, never bans anyone.
  # A Bedrock player counts on the real address Floodgate recorded, like a Java account of the same
  # home; without one (or from an address of geyser-addresses) it is never counted nor judged:
  # Geyser's own address is never a player's. Raising it above a household's size is the way to
  # be generous; start with `observe`.
  max-online-per-address: 0
  # observe | enforce, for this cap alone. `mode` above and the module-wide `mode` hold it back.
  online-mode: observe
